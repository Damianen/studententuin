name: Servermanager Tests

on:
  push:
    branches: [main]
    paths:
      - "servermanager/**"
  pull_request:
    branches: [main]
    paths:
      - "servermanager/**"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: servermanager

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: servermanager/go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run SCA (govulncheck)
        run: govulncheck ./...

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run SAST (gosec)
        run: gosec -tags integration ./...

  integration:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: servermanager

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: servermanager/go.mod

      - name: Vet (integration tag)
        run: go vet -tags integration ./...

      - name: Integration tests (real Docker)
        run: go test -tags integration -v ./internal/infra/docker/...
