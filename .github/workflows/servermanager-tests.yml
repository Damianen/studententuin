name: Servermanager Tests

on:
  push:
    branches: [main]
    paths:
      - "servermanager/**"
  pull_request:
    branches: [main]
    paths:
      - "servermanager/**"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: servermanager

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: servermanager/go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run SCA (govulncheck)
        run: govulncheck ./...

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run SAST (gosec)
        run: gosec -tags integration ./...

  integration:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: servermanager

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: servermanager/go.mod

      - name: Vet (integration tag)
        run: go vet -tags integration ./...

      - name: Integration tests (real Docker)
        run: go test -tags integration -v ./internal/infra/docker/...
