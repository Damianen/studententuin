name: Servermanager Tests

on:
  push:
    branches: [main]
    paths:
      - "servermanager/**"
  pull_request:
    branches: [main]
    paths:
      - "servermanager/**"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: servermanager

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: servermanager/go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run SCA (govulncheck)
        run: govulncheck ./...

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run SAST (gosec)
        run: gosec -tags integration ./...

  integration:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: servermanager

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: servermanager/go.mod

      - name: Vet (integration tag)
        run: go vet -tags integration ./...

      - name: Install nixpacks
        env:
          # Keep in lockstep with the ARG in servermanager/Dockerfile.
          NIXPACKS_VERSION: 1.41.0
        run: |
          curl -fsSL -o /tmp/nixpacks.tar.gz "https://github.com/railwayapp/nixpacks/releases/download/v${NIXPACKS_VERSION}/nixpacks-v${NIXPACKS_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          sudo tar -xzf /tmp/nixpacks.tar.gz -C /usr/local/bin nixpacks
          nixpacks --version

      - name: Integration tests (real Docker + nixpacks)
        run: go test -tags integration -v ./...
