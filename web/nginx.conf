# WebSocket upgrades (live log tail): forward Connection: upgrade only when
# the client actually asked for one.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the Go backend; strip the /api prefix.
    location /api/ {
        proxy_pass http://api:8080/;
        # Strip the browser Origin so the API's CORS middleware treats
        # proxied requests as same-origin (mirrors the Vite dev proxy).
        proxy_set_header Origin "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support (no-ops for plain HTTP requests).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # A live tail is idle between log lines; don't cut it off early.
        proxy_read_timeout 1h;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every other route serves the app shell.
    location / {
        try_files $uri /index.html;
    }
}
